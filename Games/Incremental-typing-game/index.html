<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <title>Incremental Typing Game</title>
</head>
<body>
    <main>
        <button id="focus-mode-toggle" type="button" aria-pressed="false">Focus mode: Off</button>
        <button id="main-upgrades-button" type="button">Upgrade tree</button>
        <section id="hud" aria-label="Game status">
            <!-- <div id="timer-display" aria-live="polite">Time: 15s</div> -->
            <div id="score-display" aria-live="polite">Score: 0</div>
            <div id="combo-display" aria-live="polite">Combo: 0</div>
        </section>
        <div id="timer-bar" aria-hidden="true">
            <div id="timer-progress"></div>
        </div>
        <section id="typing-area">
            <div id="word-display" aria-live="polite">Testing</div>
            <div id="status-display" aria-live="polite">Get ready...</div>
            <div id="caps-lock-warning" role="status" aria-live="polite" hidden>Caps Lock is on. Your typing may be marked incorrect.</div>
        </section>
    </main>
    <section id="game-over-overlay" hidden aria-labelledby="game-over-title">
        <div id="game-over-card">
            <h1 id="game-over-title">Time's up!</h1>
            <p id="final-score">Score: 0</p>
            <div id="run-stats">
                <p>Words completed: <span id="final-words">0</span></p>
                <p>Accuracy: <span id="final-accuracy">0%</span></p>
                <p>Highest combo: <span id="final-combo">0</span></p>
            </div>
            <div id="game-over-actions">
                <button id="restart-button" type="button">Play again - Enter</button>
                <button id="upgrades-button" type="button">Upgrade tree</button>
            </div>
        </div>
    </section>
    <section id="upgrade-overlay" hidden aria-labelledby="upgrade-title">
        <div id="upgrade-screen">
            <header id="upgrade-header">
                <h1 id="upgrade-title">Upgrade Tree</h1>
                <p>Points: <span id="banked-points">0</span></p>
            </header>
            <section id="difficulty-panel" aria-labelledby="difficulty-title">
                <div>
                    <h2 id="difficulty-title">Difficulty</h2>
                    <p id="difficulty-description">Lowercase words with no punctuation.</p>
                </div>
                <label for="difficulty-select">Mode
                    <select id="difficulty-select">
                        <option value="warm-up">Warm-up · 1x points</option>
                        <option value="standard">Standard · 1.25x points</option>
                        <option value="precise">Precise · 1.5x points</option>
                        <option value="expert">Expert · 2x points</option>
                    </select>
                </label>
            </section>
            <p id="upgrade-hint">Follow each branch from left to right</p>
            <div id="upgrade-viewport">
                <div id="upgrade-tree" aria-label="Upgrade paths"></div>
            </div>
            <div id="upgrade-actions">
                <button id="back-to-typing" type="button">Back to typing</button>
                <button id="reset-progress-button" type="button">Reset progress</button>
            </div>
        </div>
    </section>
    <input id="typing-input" autocomplete="off" disabled>
    <script src="script.js"></script>
</body>
</html>
